name: Publish Package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  # Installs, builds and packs with no publishing rights
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: ./pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # - run: pnpm test
      # Builds dist/ and runs publint; pnpm pack doesn't run prepublishOnly
      - run: pnpm run package
      - run: pnpm pack
      # GitHub Packages only accepts npm packages scoped to the repository owner
      - name: Pack for GitHub Packages
        run: |
          npm pkg set name="@${{ github.repository_owner }}/svelte-gauge"
          pnpm pack
      - uses: actions/upload-artifact@v4
        with:
          name: package
          path: "*.tgz"
          if-no-files-found: error

  # Publishes a tarball the check job built; runs no project or dependency code
  publish-npm:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      id-token: write # npm trusted publishing (OIDC); provenance is added automatically
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - uses: actions/download-artifact@v4
        with:
          name: package
      - run: npm publish svelte-gauge-*.tgz

  publish-github:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://npm.pkg.github.com/
          scope: "@${{ github.repository_owner }}"
      - uses: actions/download-artifact@v4
        with:
          name: package
      - run: npm publish ${{ github.repository_owner }}-svelte-gauge-*.tgz
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
